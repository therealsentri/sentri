# Render Blueprint: Sentri backend (production values match the running service).
# Secrets stay in Render's environment; they are never written in this file.
services:
  - type: web
    name: sentri-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - Dockerfile.backend
    envVars:
      - key: NODE_ENV
        value: development
      - key: STORE
        value: postgres
      - key: OTP_PROVIDER
        value: telegram
      - key: SMS_PROVIDER
        value: mock
      - key: PUSH_PROVIDER
        value: fcm
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Existing secret values in Render are retained.
      - key: DATABASE_URL
        sync: false
      - key: DATA_KEY
        sync: false
      - key: PHONE_HMAC_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TOKEN_SECRET
        sync: false
      - key: PIN_PEPPER
        sync: false
      - key: FCM_SERVICE_ACCOUNT_B64
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
